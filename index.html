function upc(){const pm=$("#pc").value.trim().toUpperCase().match(/^(JIN|MIMI)P(\d+)G(\d)U(\d+)(\d)$/);if(pm&&pm[1]==NM[ACC].toUpperCase()&&cp(ACC,{p:+pm[2],gb:+pm[3],g:+pm[4]})==pm[0]){ST.p=+pm[2];ST.gb=+pm[3];ST.g=+pm[4];save();home();return}const gm=$("#pc").value.trim().toUpperCase().match(/^(JIN|MIMI)G(\d)U(\d+)(\d)$/);if(gm&&gm[1]==NM[ACC].toUpperCase()&&cg(ACC,+gm[2],+gm[3])==gm[0]){ST.gb=+gm[2];ST.g=+gm[3];save();home();return}const v=$("#pc").value.trim().toUpperCase(),m=v.match(/^(JIN|MIMI)(\d+)(\d)$/);if(m&&m[1]==NM[ACC].toUpperCase()&&cc(ACC,+m[2])==v){ST.p=+m[2];save();home()}else{$("#fb").style.color="var(--bad)";$("#fb").textContent="That code doesn’t match. Please check with Daisy."}}
const enc=(a,st)=>btoa(unescape(encodeURIComponent(JSON.stringify({a,st}))));const code=()=>enc(ACC,ST);
function imp(id){const el=$("#"+id);try{const r=JSON.parse(decodeURIComponent(escape(atob(el.value.trim()))));const a=r.a||ACC,st=r.st||r;if(!NM[a]||a=="daisy"||typeof st.p!="number"||!st.it||!st.ss)throw 0;if(!TCH&&a!=ACC)throw 1;const l=peek(a),seen=new Set(l.ss.map(x=>JSON.stringify(x)));st.ss.forEach(x=>{if(!seen.has(JSON.stringify(x)))l.ss.push(x)});l.ss.sort((x,y)=>x.d<y.d?-1:1);l.x=Math.max(l.x||0,st.x||0);Object.keys(st.it).forEach(k=>{const o=l.it[k],n=st.it[k];if(!o||(n.b+n.w)>=(o.b+o.w))l.it[k]=n});if(!TCH){l.p=st.p;l.g=st.g;l.gb=st.gb}localStorage.setItem(K+a,JSON.stringify(l));if(ACC==a)ST=l;TCH&&!ACC?dash():resView()}catch(e){el.value="";el.placeholder="That code doesn’t work. Please copy it again."}}
function enter(a,t){ACC=a;TCH=t;ST=peek(a);book(a);go(t?"res":"home")}
function login(){ACC="";TCH=0;$("#n0").className=$("#n1").className="";A.innerHTML=`<h1>👋 Who’s playing?</h1>${["jin","mimi"].map(a=>`<button class="btn big opt" style="text-align:center" onclick="kpin('${a}')"><span style="font-size:44px">${AV[a]}</span><br>${NM[a]}</button>`).join("")}<button class="btn big alt" onclick="pin()">${AV.daisy}<br>Teacher Daisy</button>`}
function pin(){const h=1;A.innerHTML=`<h1>👩‍🏫 Teacher Daisy</h1><div class="card"><b>${h?"Enter your PIN":"Create a 4-digit PIN"}</b><input id="pn" type="password" inputmode="numeric" maxlength="4" style="width:100%;font:inherit;font-size:28px;text-align:center;padding:10px;margin:10px 0;border-radius:12px;border:2px solid var(--ln);background:var(--card);color:var(--ink)"><div class="fb" id="fb"></div><button class="btn" onclick="chk(${h?1:0})">Continue</button><button class="btn alt" onclick="login()">Back</button></div>`}
function chk(h){const v=$("#pn").value;if(!/^\d{4}$/.test(v)){$("#fb").textContent="Please enter 4 digits.";return}if(v!="0611"){$("#fb").textContent="Wrong PIN.";return}dash()}
function setp(a,v){const s=peek(a);s.p=+v;try{localStorage.setItem(K+a,JSON.stringify(s))}catch(e){}dash()}
function dash(){ACC="";TCH=1;A.innerHTML=`<h1>👩‍🏫 Teacher dashboard</h1>`+["jin","mimi"].map(a=>{const s=peek(a),n=s.ss.length,l=s.ss[n-1],ac=n?Math.round(s.ss.reduce((x,y)=>x+y.s,0)/s.ss.reduce((x,y)=>x+y.n,0)*100):0;
return`<div class="card"><b>${AV[a]} ${NM[a]}</b><div class="mut">${n} sessions · ${ac}% accuracy · last: ${l?l.d:"—"}</div><div class="mut" style="margin-top:8px">Finished in class up to:</div><select onchange="setp('${a}',this.value)">${(a=="mimi"?UNM:UNJ).map((u,i)=>`<option value="${i}" ${i==s.p?"selected":""}>${u}</option>`).join("")}</select>${a!="daisy"?`<div class="mut" style="margin-top:8px">Grammar book:</div><select onchange="setgb('${a}',this.value)">${BKS.map((B,i)=>`<option value="${i}" ${i==(gbs(a,s))?"selected":""}>${B.n}</option>`).join("")}</select><div class="mut" style="margin-top:6px">Grammar unit:</div><select onchange="setg('${a}',this.value)">${BKS[gbs(a,s)].u.map((u,i)=>`<option value="${i}" ${i==gus(a,s)?"selected":""}>${u}</option>`).join("")}</select><div class="mut" style="margin:6px 0">Progress code for ${NM[a]}’s device (class + grammar): <b>${cp(a,s)}</b></div>`:""}<button class="btn alt" onclick="enter('${a}',1)">📊 See details</button><div class="mut" style="margin-top:4px">PIN: ${localStorage.getItem(K+"pin_"+a)?"set":"not set yet"}</div><button class="btn alt" onclick="rpin('${a}')">🔑 Reset ${NM[a]}’s PIN</button><details><summary class="mut">Sync code for ${NM[a]}’s device</summary><textarea rows="3" readonly onclick="this.select()">${enc(a,s)}</textarea></details></div>`}).join("")+`<div class="card"><b>🔁 Sync from a child’s device</b><div class="mut">On the child’s device open Results → Transfer data and copy the code. Paste it here to add their latest results to this device.</div><textarea id="td" rows="3" placeholder="Paste a code here"></textarea><button class="btn alt" onclick="imp('td')">Merge code</button></div><button class="btn alt" onclick="login()">Log out</button>`}
const bar=()=>{$("#who").innerHTML=ACC||TCH?`<span>${ACC?AV[ACC]+" "+NM[ACC]:AV.daisy+" Teacher Daisy"}</span><button onclick="login()">🔄 Switch account</button>`:""};new MutationObserver(bar).observe($("#app"),{childList:true});
["jin","mimi"].forEach(a=>{try{const v=localStorage.getItem(K+"av_"+a);if(v)AV[a]=v}catch(e){}});
const PI='style="width:100%;font:inherit;font-size:28px;text-align:center;padding:10px;margin:10px 0;border-radius:12px;border:2px solid var(--ln);background:var(--card);color:var(--ink)"';
function kpin(a){const h=localStorage.getItem(K+"pin_"+a);A.innerHTML=`<h1>${AV[a]} Hi ${NM[a]}!</h1><div class="card"><b>${h?"Enter your PIN":"Create your 4-digit PIN"}</b>${h?"":'<div class="mut">Choose numbers you will remember.</div>'}<input id="pn" type="password" inputmode="numeric" maxlength="4" ${PI}><div class="fb" id="fb"></div><button class="btn" onclick="kchk('${a}',${h?1:0})">Let’s go!</button><button class="btn alt" onclick="login()">Back</button>${h?'<div class="mut">Forgot it? Ask Teacher Daisy to reset it.</div>':""}</div>`}
function kchk(a,h){const v=$("#pn").value;if(!/^\d{4}$/.test(v)){$("#fb").textContent="Please enter 4 digits.";return}try{if(!h)localStorage.setItem(K+"pin_"+a,v);else if(localStorage.getItem(K+"pin_"+a)!=v){$("#fb").textContent="Wrong PIN. Try again.";return}}catch(e){}enter(a,0)}
function rpin(a){try{localStorage.removeItem(K+"pin_"+a)}catch(e){}dash()}
function setav(e){AV[ACC]=e;try{localStorage.setItem(K+"av_"+ACC,e)}catch(x){}account()}
function cpin(){const v=$("#np").value;if(!/^\d{4}$/.test(v)){$("#fb").style.color="var(--bad)";$("#fb").textContent="Please enter 4 digits.";return}try{localStorage.setItem(K+"pin_"+ACC,v)}catch(e){}$("#np").value="";$("#fb").style.color="var(--ok)";$("#fb").textContent="PIN changed ✅"}
function stest(){say("hello");const n=window.speechSynthesis?speechSynthesis.getVoices().length:0;aud("hello").then(u=>{$("#sf").textContent=(u?"Recorded voice: found. ":"Recorded voice: not found (check the internet). ")+"Device voices: "+n+(n?"":" — this device has no built-in voice.")})}
function account(){$("#n0").className=$("#n1").className="";A.innerHTML=`<h1>${AV[ACC]} ${NM[ACC]}’s account</h1><div class="card"><div class="row"><div><div class="big-n">${Math.floor(ST.x/100)+1}</div><div class="mut">level</div></div><div><div class="big-n">${streak()}🔥</div><div class="mut">day streak</div></div><div><div class="big-n">${ST.ss.length}</div><div class="mut">sessions</div></div></div></div>
<div class="card"><b>🎨 My icon</b><div class="tiles">${["🐼","🐱","🦊","🐯","🐸","🦁","🐶","🦄"].map(e=>`<button class="t" onclick="setav('${e}')">${e}</button>`).join("")}</div></div>
<div class="card"><b>📚 My class progress</b><div style="font-size:19px;margin:6px 0">${UN[ST.p]}</div>${ACC?`<div class="mut">Grammar: ${GN()}</div>`:""}<div class="mut">Teacher Daisy updates this.</div></div>
<div class="card"><b>🔒 My PIN</b><input id="np" type="password" inputmode="numeric" maxlength="4" placeholder="New 4-digit PIN" ${PI}><div class="fb" id="fb"></div><button class="btn alt" onclick="cpin()">Change PIN</button></div>
<div class="card"><b>🔊 Sound test</b><div class="mut">Tap to hear the word “hello”. Make sure the volume is up and the phone is not on silent.</div><button class="btn alt" onclick="stest()">▶ Play test sound</button><div class="mut" id="sf"></div></div>
<div class="card"><b>🔄 Switch account</b>${["jin","mimi"].filter(a=>a!=ACC).map(a=>`<button class="btn alt" onclick="kpin('${a}')">${AV[a]} ${NM[a]}</button>`).join("")}<button class="btn alt" onclick="pin()">${AV.daisy} Teacher Daisy</button><button class="btn alt" onclick="login()">Log out</button></div>`}
login();
</script>
</body></html>
